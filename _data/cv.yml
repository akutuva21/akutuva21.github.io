- title: Experience
  type: time_table
  contents:
    - title: Graduate Researcher
      institution: Faeder/Hawse Labs, Pitt/CMU
      year: 2024 - Present
      description:
        - Developing **BNGPlayground** and contributing to the formal semantics of the BioNetGen ecosystem for rule-based modeling.
        - Unravelling the regulatory programs of **T-cell plasticity and pathogenicity** using multi-omic integration and mechanistic modeling of IL-6/TGF-β signaling.
        - Leveraging **Optimal Experimental Design (OED)** and multistart optimization to calibrate and validate high-dimensional biochemical models.
    - title: Mathematics Instructor
      institution: Mathnasium - The Math Learning Center
      year: 2019 - 2020
      description:
        - Guided and instructed students of diverse proficiency levels through innovative mathematics teaching methods.
    - title: Summer Research Intern
      institution: Moffitt Cancer Center, Enderling Lab
      year: 2021, 2018
      description:
        - Research in mathematical oncology and radiotherapy modeling.
    - title: Undergraduate Researcher
      institution: UF Laboratory for Systems Medicine
      year: 2022 - 2024
      description:
        - Mentored by Dr. Henrique Ribeiro and Dr. Reinhard Laubenbacher. Supported through the University Scholar Programs in the UF College of Medicine.
        - Developed an integrative **Boolean network model for SARS-CoV-2 infection**, focusing on viral effects on pneumocytes and identifying key regulatory nodes in AKT-mTOR and ACE2-Angiotensin pathways.
        - Constructed an ensemble of asynchronous networks to explore the deterministic nature of viral regulatory mechanisms.
    - title: Summer Research Intern (SPARK REU)
      institution: Moffitt Cancer Center, Enderling Lab
      year: 2021
      description:
        - Participated in the **Summer Undergraduate Program to Advance Research Knowledge (SPARK)**.
        - Compared **Direct Volume Reduction (DVR)** and **Carrying Capacity Reduction (CCR)** models to optimize radiation response therapy cumulative dose and fractionation.
    - title: Young Scholars Program Researcher
      institution: Florida State University
      year: 2019
      description:
        - Conducted college-level research on **Major Depressive Disorder (MDD)** categorization.
        - Analyzed patient **Electroencephalogram (EEG)** data using Machine Learning algorithms to identify neuro-biomarkers.
    - title: HIP-IMO Intern
      institution: Moffitt Cancer Center
      year: 2018
      description:
        - Participated in the **High School Internship Program in Integrative Mathematical Oncology**.
        - Personalized radiation response treatment based on individual specific **Tumor Proliferation Saturation** to improve patient-specific therapy outcomes.

